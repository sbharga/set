[project]
name = "set"
version = "0.1.0"
description = "Real-time versus mode for the card game SET"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "flask-socketio>=5.3",
    "gunicorn>=23.0",
    "simple-websocket>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/set_game"]
